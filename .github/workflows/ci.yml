name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build project
        run: |
          echo "Building DevOps Web App"
          test -f index.html
          echo "Build successful"

      - name: Slack Success Notification
        if: success()
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{"text":"✅ CI Pipeline SUCCESS - DevOps Web App"}' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Slack Failure Notification
        if: failure()
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{"text":"❌ CI Pipeline FAILED - DevOps Web App"}' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
